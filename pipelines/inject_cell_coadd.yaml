description: LSSTCam object injection specialization of the DRP pipeline
instrument: lsst.obs.lsst.LsstCam
imports:
  - location: $DRP_PIPE_DIR/pipelines/LSSTCam/DRP-future.yaml
    labeledSubsetModifyMode: EDIT
    exclude:
      - makeDirectWarp
      - makePsfMatchedWarp
      - selectDeepCoaddVisits
      - selectTemplateCoaddVisits
      - assembleDeepCoadd
      - assembleTemplateCoadd
      - assembleCellCoadd
    importSteps: False
tasks:
  inject_coadd:
    class: lsst.source.injection.inject_coadd.CoaddInjectTask
    config:
      - connections.input_exposure: deep_coadd
        connections.output_exposure: injected_deep_coadd_cell_predetection
        connections.output_catalog: injected_deep_coadd_predetection_catalog
        use_cell_coadds: parameters.use_cell_coadds
  detectCoaddPeaks:
    class: lsst.pipe.tasks.multiBand.DetectCoaddSourcesTask
    config:
      - connections.exposure: injected_deep_coadd_predetection
        imageType: parameters.image_type
  makeHealSparsePropertyMaps:
    class: lsst.pipe.tasks.healSparseMapping.HealSparsePropertyMapTask
    config:
      connections.coadd_exposures: injected_deep_coadd_predetection
subsets:
  step3a1-inject-coadd:
    subset:
      - inject_coadd
    description: |
      A step that injects synthetic objects into coadds.
steps:
  - label: step3a1-inject-coadd
    dimensions: [tract]
  - label: step3a-coadd-tracts
    dimensions: [tract]
  - label: step3b-coadd-global
    dimensions: []
